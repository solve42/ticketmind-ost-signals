name: Release Metadata

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate changelog and plugin version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f CHANGELOG.md || ! -f plugin.php ]]; then
            echo "CHANGELOG.md and plugin.php must exist in the repository root." >&2
            exit 1
          fi

          FIRST_HEADING="$(head -n 1 CHANGELOG.md)"
          CHANGELOG_VERSION="$(printf '%s\n' "${FIRST_HEADING}" | sed -nE 's/^# [0-9]{4}-[0-9]{2}-[0-9]{2} ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          if [[ -z "${CHANGELOG_VERSION}" ]]; then
            echo "Top changelog heading must start with '# YYYY-MM-DD X.Y.Z': ${FIRST_HEADING}" >&2
            exit 1
          fi

          PLUGIN_VERSION="$(sed -nE "s/^[[:space:]]*'version'[[:space:]]*=>[[:space:]]*'([^']+)',[[:space:]]*$/\\1/p" plugin.php | head -n 1)"
          if [[ -z "${PLUGIN_VERSION}" ]]; then
            echo "Could not read the version from plugin.php." >&2
            exit 1
          fi

          if [[ "${PLUGIN_VERSION}" != "${CHANGELOG_VERSION}" ]]; then
            echo "plugin.php version '${PLUGIN_VERSION}' does not match top changelog version '${CHANGELOG_VERSION}'." >&2
            exit 1
          fi

          echo "Release metadata is valid: ${CHANGELOG_VERSION}"
